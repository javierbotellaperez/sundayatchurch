<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Frame.io connection — Sunday At Church</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111; color: #24211e; font: 16px/1.6 Arial, sans-serif; }
    main { width: min(100%, 660px); padding: 36px; border-radius: 16px; background: #fff; }
    .eyebrow { font: 11px/1.4 monospace; letter-spacing: .16em; color: #9b8d82; }
    h1 { font: 700 clamp(38px, 8vw, 64px)/.98 Georgia, serif; color: #eee7df; margin: 24px 0; }
    .result { border: 1px solid #ded6cf; border-radius: 12px; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    a { color: #151515; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">SUNDAY AT CHURCH · PRIVATE ADMIN AREA</p>
  <h1>Frame.io connection</h1>
  <p id="status" role="status" aria-live="polite">Checking Adobe's response…</p>
  <div id="detail" class="result" hidden></div>
  <p><a href="./connect.html">Try connecting again</a></p>
  <p><a href="../index.html">Return to the website</a></p>
</main>
<script>
const CLIENT_ID = "243c66aa87e6460f91e6abe0a0ed27c7";
const TOKEN_URL = "https://ims-na1.adobelogin.com/ims/token/v3";
const API_BASE = "https://api.frame.io/v4";
const statusEl = document.getElementById("status");
const detailEl = document.getElementById("detail");

function show(message) {
  detailEl.hidden = false;
  detailEl.textContent = message;
}

async function run() {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const returnedState = params.get("state");
  const adobeError = params.get("error");
  const expectedState = localStorage.getItem("sac_oauth_state");
  const verifier = localStorage.getItem("sac_pkce_verifier");
  history.replaceState({}, document.title, location.pathname);

  if (adobeError) throw new Error("Adobe sign-in was not completed: " + adobeError);
  if (!code || !returnedState) throw new Error("No authorisation code was returned. Start again from Connect Frame.io.");
  if (!expectedState || returnedState !== expectedState) throw new Error("The OAuth state check failed. Start a fresh sign-in.");
  if (!verifier) throw new Error("The PKCE verifier is missing. Start a fresh sign-in.");

  localStorage.removeItem("sac_oauth_state");
  localStorage.removeItem("sac_pkce_verifier");

  statusEl.textContent = "Exchanging the authorisation code with Adobe…";
  const tokenUrl = TOKEN_URL + "?client_id=" + encodeURIComponent(CLIENT_ID);
  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code,
    code_verifier: verifier
  });

  let tokenResponse;
  try {
    tokenResponse = await fetch(tokenUrl, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
  } catch (err) {
    throw new Error("The browser blocked the Adobe token request (usually a CORS restriction). The callback and redirect are now aligned, and the request follows Adobe's documented SPA format. GitHub Pages cannot proxy this request. We must confirm whether Adobe permits this origin before deciding on a backend.");
  }

  const tokenData = await tokenResponse.json().catch(() => ({}));
  if (!tokenResponse.ok || !tokenData.access_token) {
    throw new Error(tokenData.error_description || tokenData.error || "Adobe token exchange failed (HTTP " + tokenResponse.status + ").");
  }

  statusEl.textContent = "Adobe authorisation succeeded. Checking Frame.io API access…";
  let meResponse;
  try {
    meResponse = await fetch(API_BASE + "/me", {
      headers: { Authorization: "Bearer " + tokenData.access_token }
    });
  } catch (err) {
    throw new Error("Adobe issued an access token, but the browser could not reach the Frame.io API. This may be a separate CORS restriction on the Frame.io API.");
  }
  if (!meResponse.ok) throw new Error("Adobe token exchange succeeded, but Frame.io identity check returned HTTP " + meResponse.status + ".");
  const meData = await meResponse.json().catch(() => ({}));

  statusEl.textContent = "Adobe sign-in and Frame.io API check succeeded.";
  show("Connected identity: " + (meData.name || meData.email || meData.user_id || "Frame.io user") +
       "\\n\\nThis is only a connection test. No access token has been saved or displayed. No folders or uploads have been created.");
  // Access token remains only in this page's memory and is discarded on navigation/reload.
}

run().catch(err => {
  statusEl.textContent = "Connection not completed.";
  show(err.message + "\\n\\nNo access token has been saved by this page.");
});
</script>
</body>
</html>
